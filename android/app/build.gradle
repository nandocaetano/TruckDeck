plugins {
    id 'com.android.application'
}

def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    // The application id below becomes permanent on Google Play at the first upload.
    namespace 'com.hunters.trucksimbuttonbox'
    compileSdk 36

    defaultConfig {
        applicationId 'com.hunters.trucksimbuttonbox'
        // Android 7.0: old tablets are exactly the devices people mount next to a wheel
        minSdk 24
        // Google Play requires new apps to target a recent API level; raise when Play asks
        targetSdk 36
        // versionCode must go up by one for every upload to Google Play
        versionCode 9
        versionName "1.0.0-rc7"
    }

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            // nothing to shrink: one activity, no libraries
            minifyEnabled false
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
