<div id="loading-screen" style="position:fixed;inset:0;z-index:9999;background:#000;opacity:1">
  <style>
    #loading-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #000;
      opacity: 1;
      transition: opacity 300ms linear;
    }
    #loading-screen.done {
      opacity: 0;
      pointer-events: none;
    }
    #loading-screen video {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      opacity: 0;
      pointer-events: none;
    }
    #loading-screen.playing video {
      opacity: 1;
    }
    #loading-screen video::-webkit-media-controls,
    #loading-screen video::-webkit-media-controls-overlay-play-button,
    #loading-screen video::-webkit-media-controls-start-playback-button {
      display: none !important;
      -webkit-appearance: none;
    }
  </style>
  <video autoplay muted playsinline preload="auto" poster="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" disablepictureinpicture controlslist="nodownload noplaybackrate nofullscreen" aria-hidden="true">
    <source src="brand/mad-frog-loading.mp4" type="video/mp4">
  </video>
  <script>
    (() => {
      const screen = document.currentScript.parentElement;
      const video = screen.querySelector('video');
      if (window.matchMedia?.('(prefers-reduced-motion: reduce)').matches) {
        screen.remove();
        return;
      }
      const finish = () => {
        if (!screen.isConnected) return;
        screen.classList.add('done');
        setTimeout(() => screen.remove(), 300);
      };
      const reveal = () => screen.classList.add('playing');
      video.muted = true;
      video.addEventListener('playing', reveal, { once: true });
      video.addEventListener('ended', finish, { once: true });
      video.addEventListener('error', finish, { once: true });
      video.play().then(reveal).catch(finish);
      setTimeout(() => screen.classList.add('done'), 4700);
      setTimeout(() => screen.remove(), 5000);
    })();
  </script>
</div>
